<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>loops</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <span id="crumb"></span>
  <span class="badge" id="nowBadge" title="Things whose time has come" hidden></span>
  <button class="file-btn" id="notifyBtn"></button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
</header>
<div id="summary" title="Show what needs you today (s)"></div>

<main>
  <section class="pane" id="loopsPane">
    <div class="pane-head"><span id="loopsTitle">Loops</span></div>
    <ul id="loops"></ul>
    <div class="splitter" id="loopsSplitter" title="Drag to resize · double-click to reset"></div>
  </section>
  <section class="pane" id="tasksPane">
    <div class="pane-head"><span id="tasksTitle">Tasks</span></div>
    <ul id="tasks"></ul>
    <div class="splitter" id="sideSplitter" title="Drag to resize · double-click to reset"></div>
  </section>
  <div class="side">
    <section class="pane" id="todayPane">
      <div class="pane-head"><span>Today</span></div>
      <ul id="today"></ul>
    </section>
  </div>
</main>

<div class="pane focused" id="picker" hidden>
  <div class="pane-head"><span>New loop from template</span></div>
  <ul id="pickerList"></ul>
</div>

<div class="pane focused" id="noteBox" hidden>
  <div class="pane-head"><span id="noteHead"></span><span id="noteMode"></span></div>
  <textarea id="noteInput" spellcheck="false"></textarea>
</div>

<div class="pane focused" id="help" hidden>
  <div class="pane-head"><span>Keys</span><span>esc to close</span></div>
  <div id="helpBody"></div>
</div>

<footer id="status">
  <span class="mode tpl" id="tplBadge" hidden>TEMPLATES</span>
  <span class="mode" id="mode"></span>
  <span id="searchBox" hidden>/<input id="searchInput" autocomplete="off" spellcheck="false"></span>
  <span id="cmdBox" hidden>:<input id="cmdInput" autocomplete="off" spellcheck="false"></span>
  <span id="searchInfo"></span>
  <span class="clip" id="clip"></span>
  <span class="flash" id="flash"></span>
  <span class="spacer"></span>
  <span id="hints"></span>
</footer>

<script type="module" src="src/main.js"></script>
</body>
</html>
