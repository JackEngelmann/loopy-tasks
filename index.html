<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>loops</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }

  :root {
    color-scheme: light dark;
    --bg: #f6f5f2;
    --pane: #ffffff;
    --border: #e2e0da;
    --text: #1c1b19;
    --text-2: #55534f;
    --text-3: #85827c;
    --sel: #3b5bdb;
    --sel-text: #ffffff;
    --sel-dim: #e3e8fb;
    --stale: #b7791f;
    --stale-bg: #fff6d6;
    --tag: #4c5fb8;
    --cut: #c0392b;
    --wait: #2f7f86;
    --imp: #b83280;
    --mark: #ffe08a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413;
      --pane: #1e1e1c;
      --border: #3a3935;
      --text: #f2f0eb;
      --text-2: #c4c1ba;
      --text-3: #98958e;
      --sel: #7c93f0;
      --sel-text: #111111;
      --sel-dim: #262c45;
      --stale: #e6b94a;
      --stale-bg: #2b2412;
      --tag: #9aaaf0;
      --cut: #e57368;
      --wait: #6cc4cc;
      --imp: #f08bc0;
      --mark: #6b5512;
    }
  }

  body {
    font: 13.5px/1.5 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    color: var(--text-2);
    flex-shrink: 0;
  }
  header b { color: var(--text); font-weight: 600; }
  #crumb { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-btn {
    font: inherit;
    font-size: 12px;
    color: var(--text-2);
    background: var(--pane);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 8px;
    cursor: pointer;
  }
  .file-btn:hover { color: var(--text); border-color: var(--sel); }
  footer .flash { color: var(--text-2); }
  footer .flash.error { color: var(--cut); }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(260px, 28%) 1fr minmax(240px, 28%);
    gap: 8px;
    padding: 0 8px;
    min-height: 0;
  }

  /* right column: important, waiting, timed (read-only) */
  .side { display: flex; flex-direction: column; gap: 8px; min-height: 0; min-width: 0; }
  .side .pane { flex: 1 1 0; }

  /* narrow windows (e.g. half a screen): the right column folds into a summary line,
     and s shows it as an overlay */
  #summary {
    display: none;
    gap: 14px;
    flex-wrap: wrap;
    padding: 0 14px 6px;
    font-size: 12px;
    color: var(--text-2);
    cursor: pointer;
  }
  #summary .wait { color: var(--wait); }
  #summary .time { color: var(--tag); }
  #summary .due { color: var(--stale); }
  #summary .hint { color: var(--text-3); margin-left: auto; }
  @media (max-width: 1100px) {
    main { grid-template-columns: minmax(220px, 38%) 1fr; }
    #summary { display: flex; }
    .side { display: none; }
    body.side-open .side {
      display: flex;
      position: fixed;
      top: 64px;
      right: 8px;
      bottom: 36px;
      width: min(380px, calc(100vw - 32px));
      padding: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
      z-index: 5;
    }
  }

  .pane {
    background: var(--pane);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }
  .pane.focused { border-color: var(--sel); }

  .pane-head {
    padding: 6px 10px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: var(--text-3);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  #waitingPane .pane-head span:first-child { color: var(--wait); }
  #importantPane .pane-head span:first-child { color: var(--imp); }
  .star { color: var(--imp); }

  ul { list-style: none; overflow-y: auto; flex: 1; padding: 4px 0; }

  .row {
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 10px;
    cursor: default;
    white-space: nowrap;
  }
  .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .row .count { color: var(--text-3); font-size: 12px; }

  /* loops */
  .row.virtual .name { color: var(--text-2); }
  .row.gap-after { margin-bottom: 14px; }

  /* real loops: title + counts, then the first next action */
  .row.loop { flex-direction: column; align-items: stretch; gap: 0; padding: 4px 10px; }
  /* counts wrap below the title rather than truncating it */
  .loop-line { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; min-width: 0; }
  .loop-line .name { flex: 0 1 auto; font-weight: 600; }
  .counts { margin-left: auto; color: var(--text-3); font-size: 11px; }
  .loop-next {
    display: flex;
    gap: 8px;
    align-items: baseline;
    font-size: 12px;
    color: var(--text-2);
  }
  .loop-next .name { font-weight: normal; }
  /* notes (m): where you left off, with their age */
  .loop-note, .task-note {
    font-size: 11px;
    color: var(--text-3);
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row.has-note { flex-wrap: wrap; row-gap: 0; }
  .task-note { flex-basis: 100%; padding-left: calc(1ch + 8px); }
  .task-note.full { white-space: pre-wrap; overflow-wrap: anywhere; }
  .note-age { color: var(--text-3); opacity: .8; }
  .note-mark { color: var(--text-3); font-size: 11px; }
  .wait-age { color: var(--wait); font-size: 11px; font-variant-numeric: tabular-nums; }
  .note-block {
    margin: 0 10px 6px;
    padding: 6px 8px;
    font-size: 12px;
    color: var(--text-2);
    border-left: 2px solid var(--border);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  /* long loop notes are cut off; m shows all of it */
  .note-block .clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 6; overflow: hidden; }
  .row.stale { background: var(--stale-bg); }
  .row.stale .name, .row.stale .loop-next { color: var(--stale); }
  .row.waiting-loop .name, .row.waiting-loop .loop-next { color: var(--wait); }

  /* selection: solid bar in focused pane, faint in the others */
  .pane:not(.focused) .row.sel { background: var(--sel-dim); }
  .pane.focused .row.sel { background: var(--sel); }
  .pane.focused .row.sel, .pane.focused .row.sel * { color: var(--sel-text) !important; }
  /* the edit box keeps its own background, so it needs normal text color */
  .pane.focused .row.sel .edit { color: var(--text) !important; }

  /* tasks */
  .check { color: var(--text-3); width: 1ch; }
  .row.done .name { color: var(--text-3); text-decoration: line-through; }
  .row.cut .name { color: var(--cut); }
  .tag { color: var(--tag); font-size: 12px; }
  .tag.none { color: var(--text-3); }

  /* waiting pane: items outside the selected loop fade back */
  #waiting .check { color: var(--wait); }
  #waiting .row.other, #timed .row.other { opacity: .45; }

  /* timed pane */
  #timedPane .pane-head span:first-child { color: var(--tag); }
  .time { color: var(--tag); font-variant-numeric: tabular-nums; }
  .row.due .time { color: var(--stale); font-weight: 600; }

  /* the next action of a loop stands out; the rest of its tasks recede */
  .row.next .check { color: var(--sel); }
  .row.backlog .name { color: var(--text-2); }

  .empty { padding: 10px; color: var(--text-3); }
  .empty.stale { color: var(--stale); }

  .edit {
    flex: 1;
    min-width: 0;
    font: inherit;
    color: var(--text);
    background: var(--pane);
    border: 1px solid var(--sel);
    border-radius: 3px;
    padding: 0 4px;
    outline: none;
  }

  footer {
    display: flex;
    gap: 16px;
    padding: 6px 14px;
    font-size: 12px;
    color: var(--text-3);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  footer .mode {
    color: var(--sel-text);
    background: var(--sel);
    padding: 0 6px;
    border-radius: 3px;
    font-weight: 600;
  }
  footer .clip { color: var(--cut); }
  #searchBox { color: var(--text); }
  #searchBox input {
    width: 28ch;
    font: inherit;
    color: var(--text);
    background: none;
    border: none;
    outline: none;
  }
  #searchInfo { color: var(--text-2); }
  .no-match { color: var(--cut); }

  /* template mode: tinted panes and a badge so it's never mistaken for real loops */
  footer .mode.tpl { background: var(--imp); }
  .template-mode #loopsPane, .template-mode #tasksPane { border-style: dashed; }
  .template-mode .pane.focused { border-color: var(--imp); }
  .template-mode .pane.focused .row.sel { background: var(--imp); }
  .template-mode #loopsTitle { color: var(--imp); }

  /* template picker (t) */
  #picker {
    position: fixed;
    top: 18%;
    left: 50%;
    transform: translateX(-50%);
    width: min(420px, calc(100vw - 32px));
    max-height: 60vh;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
    z-index: 10;
  }

  /* note editor (m): multi-line with a few vim keys; :wq saves */
  #noteBox {
    position: fixed;
    top: 12%;
    left: 50%;
    transform: translateX(-50%);
    width: min(640px, calc(100vw - 32px));
    box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
    z-index: 10;
  }
  #noteHead { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #noteMode { flex-shrink: 0; text-transform: none; }
  #noteMode.error { color: var(--cut) !important; }
  #noteBox.normal #noteMode { color: var(--sel); }
  /* the selected character stands in for vim's block cursor */
  #noteBox.normal #noteInput { caret-color: transparent; }
  /* on an empty line there's no character to select, so show the caret instead */
  #noteBox.normal #noteInput.no-char { caret-color: var(--sel); }
  #noteBox.normal #noteInput::selection { background: var(--sel); color: var(--sel-text); }
  #noteInput {
    height: min(320px, 50vh);
    resize: vertical;
    font: inherit;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text);
    background: none;
    border: none;
    outline: none;
    padding: 10px;
  }

  /* search hits */
  mark { background: var(--mark); color: inherit; border-radius: 2px; }
  footer kbd { font: inherit; color: var(--text-2); }
  footer .spacer { flex: 1; }
</style>
</head>
<body>

<header>
  <span id="crumb"></span>
  <button class="file-btn" id="notifyBtn"></button>
  <button class="file-btn" id="exportBtn" title="Download all loops and tasks as JSON">export</button>
  <button class="file-btn" id="importBtn" title="Replace all data with a JSON export">import</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
</header>
<div id="summary" title="Show important, waiting and timed (s)"></div>

<main>
  <section class="pane" id="loopsPane">
    <div class="pane-head"><span id="loopsTitle">Loops</span><span id="loopsMeta"></span></div>
    <ul id="loops"></ul>
  </section>
  <section class="pane" id="tasksPane">
    <div class="pane-head"><span id="tasksTitle">Tasks</span><span id="tasksMeta"></span></div>
    <ul id="tasks"></ul>
  </section>
  <div class="side">
    <section class="pane" id="importantPane">
      <div class="pane-head"><span>Important</span><span id="importantMeta"></span></div>
      <ul id="important"></ul>
    </section>
    <section class="pane" id="waitingPane">
      <div class="pane-head"><span>Waiting</span><span id="waitingMeta"></span></div>
      <ul id="waiting"></ul>
    </section>
    <section class="pane" id="timedPane">
      <div class="pane-head"><span>Timed</span><span id="timedMeta"></span></div>
      <ul id="timed"></ul>
    </section>
  </div>
</main>

<div class="pane focused" id="picker" hidden>
  <div class="pane-head"><span>New loop from template</span></div>
  <ul id="pickerList"></ul>
</div>

<div class="pane focused" id="noteBox" hidden>
  <div class="pane-head"><span id="noteHead"></span><span id="noteMode"></span></div>
  <textarea id="noteInput" spellcheck="false"></textarea>
</div>

<footer id="status">
  <span class="mode tpl" id="tplBadge" hidden>TEMPLATES</span>
  <span class="mode" id="mode"></span>
  <span id="searchBox" hidden>/<input id="searchInput" autocomplete="off" spellcheck="false"></span>
  <span id="searchInfo"></span>
  <span class="clip" id="clip"></span>
  <span class="flash" id="flash"></span>
  <span class="spacer"></span>
  <span id="hints"></span>
</footer>

<script>
// ── Data ──────────────────────────────────────────────────────────────────────

const STORAGE_KEY = 'loops-v1';
// templates have the same shape as the main data: loops with tasks
let state = { loops: [], tasks: [], templates: { loops: [], tasks: [] } };
let history = [];

// navigable panes; the waiting and timed panes on the right are informational only
const PANES = ['loops', 'tasks'];

const ui = {
  focus: 'loops',     // one of PANES
  loopIdx: 0,         // indexes loopsList(): virtual views first, then the real loops
  taskIdx: 0,
  editing: null,      // { kind: 'new-loop' | 'new-task' | 'rename' | 'note', id?, at?, anchorId?, below? }
  cutId: null,
  showDone: false,
  search: null,       // see the Search section
  flash: null,        // { text, error? } note in the status bar, cleared on the next key
  templates: false,   // template mode: the panes edit templates instead of loops
  otherCursor: null,  // cursor of the mode you're not in, restored on T
  picker: null,       // { idx } while choosing a template with t
  sideOpen: false,    // right column shown as an overlay on narrow windows (\)
};

function load() {
  try { state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || state; } catch {}
  state.templates = state.templates || { loops: [], tasks: [] };
  stampWaiting();   // tasks that were waiting before this was tracked count from now
}
function persist() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// snapshot before every change so `u` can undo it
function mutate(fn) {
  history.push(JSON.stringify(state));
  if (history.length > 200) history.shift();
  fn();
  stampWaiting();
  persist();
}

// remember when a task started waiting, however @w got there (w, typing, import, template)
function stampWaiting() {
  state.tasks.forEach(t => {
    if (isWaiting(t) && !t.done) t.waitingSince = t.waitingSince || Date.now();
    else delete t.waitingSince;
  });
}

// the virtual "All" loop has no id, so tasks created there get no loop;
// it sits above the real loops
const ALL = { id: null, title: 'All', kind: 'all' };
const VIRTUAL = [ALL];
// stand-in when template mode has no templates yet
const NONE = { id: null, title: 'No templates', kind: 'none' };

// the data the panes edit: your loops, or the templates in template mode.
// the right column always shows your real tasks (state.tasks).
const db = () => ui.templates ? state.templates : state;
const virtuals = () => ui.templates ? [] : VIRTUAL;
const loopsList = () => [...virtuals(), ...db().loops];
const currentLoop = () => loopsList()[ui.loopIdx] || NONE;
// ids are unique across both, so tags resolve in either mode
const loopById = id => state.loops.find(l => l.id === id) || state.templates.loops.find(l => l.id === id);
const openTasks = id => db().tasks.filter(t => !t.done && (id === null || t.loopId === id));
const openCount = id => openTasks(id).length;

// "@w" / "@i" anywhere in the title mark a task as waiting / important
const tokenRe = tok => new RegExp(`(^|\\s)${tok}(?=\\s|$)`, 'g');
const hasToken = (s, tok) => tokenRe(tok).test(s);
const stripToken = (s, tok) => s.replace(tokenRe(tok), '$1').replace(/\s+/g, ' ').trim();
const toggleToken = (s, tok) => hasToken(s, tok) ? stripToken(s, tok) : `${s} ${tok}`;
const isWaiting = t => hasToken(t.title, '@w');
const isImportant = t => hasToken(t.title, '@i');

// a time like "14:30" or "0:10" anywhere in the title makes a task timed
const TIME_RE = /(^|\s)([01]?\d|2[0-3]):([0-5]\d)(?=\s|$)/;
function timeOf(t) {
  const m = t.title.match(TIME_RE);
  return m ? +m[2] * 60 + +m[3] : null;
}
const fmtTime = min => `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`;
const nowMinutes = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };

// "+20m", "+1h", "+1h30" become a clock time when the task is saved, so it stays put;
// they replace any time already in the title. Times have no date, so cap at 23:59.
const REL_RE = /(^|\s)\+(?:(\d+)h(?:(\d+)m?)?|(\d+)m)(?=\s|$)/;
function resolveRelative(title) {
  const m = title.match(REL_RE);
  if (!m) return title;
  const mins = m[4] !== undefined ? +m[4] : +m[2] * 60 + +(m[3] || 0);
  const at = fmtTime(Math.min(nowMinutes() + mins, 23 * 60 + 59));
  return title.replace(new RegExp(TIME_RE.source, 'g'), '$1').replace(REL_RE, `$1${at}`)
    .replace(/\s+/g, ' ').trim();
}

// "3h" since the note was written
function age(ms) {
  const min = Math.floor((Date.now() - ms) / 60_000);
  return min < 1 ? 'now' : min < 60 ? `${min}m` : min < 1440 ? `${Math.floor(min / 60)}h` : `${Math.floor(min / 1440)}d`;
}

const displayTitle = t => ['@w', '@i'].reduce(stripToken, t.title.replace(TIME_RE, '$1'));

// middle pane: open tasks in order (waiting ones included), then done (if shown);
// the right column mirrors important, waiting and timed tasks
function tasksFor(loop) {
  const ts = db().tasks.filter(t => loop.id === null || t.loopId === loop.id);
  const open = ts.filter(t => !t.done);
  return ui.showDone ? [...open, ...ts.filter(t => t.done)] : open;
}

// a loop's next action is its first open, non-waiting task; reorder with J/K to change it.
// tasks without a loop stand on their own, so each of them counts as a next action.
const doable = id => openTasks(id).filter(t => !isWaiting(t));
const nextOf = id => doable(id)[0];
function isNext(t) {
  if (t.done || isWaiting(t)) return false;
  return t.loopId ? nextOf(t.loopId) === t : true;
}
const currentTasks = () => tasksFor(currentLoop());
const waitingTasks = () => state.tasks.filter(t => !t.done && isWaiting(t));
// important mirrors tasks wherever they live, waiting ones included
const importantTasks = () => state.tasks.filter(t => !t.done && isImportant(t));
const timedTasks = () => state.tasks.filter(t => !t.done && timeOf(t) !== null)
  .sort((a, b) => timeOf(a) - timeOf(b));

const selTask = () => ui.focus === 'tasks' ? currentTasks()[ui.taskIdx] : null;

function clamp() {
  const fit = (i, n) => Math.max(0, Math.min(i, n - 1));
  ui.loopIdx = fit(ui.loopIdx, loopsList().length);
  ui.taskIdx = fit(ui.taskIdx, currentTasks().length);
}

// ── Render ────────────────────────────────────────────────────────────────────

function render() {
  clamp();
  dropStaleSearch();
  renderPicker();
  renderNoteBox();
  renderLoops();
  renderTasks();
  renderSide('important', importantTasks(), 'Nothing important. Press i on a task.');
  renderSide('waiting', waitingTasks(), 'Nothing waiting.');
  renderSide('timed', timedTasks(), 'Nothing timed. Put a time like 14:30 in a task.');
  renderSummary();
  renderChrome();
  renderNotifyBtn();

  document.querySelectorAll('.row.sel').forEach(el => el.scrollIntoView({ block: 'nearest' }));

  const inp = document.querySelector('.edit');
  if (inp) {
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
  }
  if (ui.search && ui.search.typing && document.activeElement !== searchInput) searchInput.focus();
}

function editInput(value) {
  return `<input class="edit" value="${esc(value)}" autocomplete="off" spellcheck="false">`;
}

function renderLoops() {
  const ed = ui.editing;
  const sel = i => i === ui.loopIdx && !(ed && ed.kind === 'new-loop');

  const rows = virtuals().map((l, i) => {
    const n = openTasks(null).length;
    const cls = ['row', 'virtual', `virtual-${l.kind}`, sel(i) && 'sel', i === VIRTUAL.length - 1 && 'gap-after']
      .filter(Boolean).join(' ');
    return `<li class="${cls}" data-i="${i}"><span class="name">${highlight(l.title, 'loops')}</span><span class="count">${n}</span></li>`;
  });

  db().loops.forEach((l, j) => {
    const i = virtuals().length + j;
    const open = openTasks(l.id);
    const next = nextOf(l.id);
    const status = loopStatus(l);
    // waiting count by the title; "+N" = doable tasks queued after the next action
    const waiting = open.filter(isWaiting).length;
    const more = Math.max(0, doable(l.id).length - 1);
    const counts = waiting ? `◷ ${waiting}` : '';
    const nextLine = next ? `▸ ${esc(displayTitle(next))}`
      : ui.templates ? 'Empty template'
      : status === 'waiting' ? 'Waiting on something'
      : 'No next action';
    // templates never go yellow/teal: they aren't work in progress
    const cls = ['row', 'loop', sel(i) && 'sel',
      !ui.templates && status === 'stale' && 'stale',
      !ui.templates && status === 'waiting' && 'waiting-loop'].filter(Boolean).join(' ');
    const name = ed && ed.kind === 'rename' && ed.id === l.id
      ? editInput(l.title)
      : `<span class="name">${highlight(l.title, 'loops')}</span>`;
    const star = open.some(isImportant) ? `<span class="star">★</span>` : '';
    rows.push(`<li class="${cls}" data-i="${i}">
      <div class="loop-line">${name}${star}<span class="counts">${counts}</span></div>
      <div class="loop-next"><span class="name">${nextLine}</span>${more ? `<span class="counts">+${more}</span>` : ''}</div>
      ${noteLine(l, 'loop-note')}
    </li>`);
  });
  if (ed && ed.kind === 'new-loop') rows.splice(virtuals().length + ed.at, 0, `<li class="row sel">${editInput('')}</li>`);
  if (!rows.length) rows.push(`<li class="empty">No templates yet. Press o to create one.</li>`);
  document.getElementById('loops').innerHTML = rows.join('');
  document.getElementById('loopsTitle').textContent = ui.templates ? 'Templates' : 'Loops';

  const stale = state.loops.filter(l => loopStatus(l) === 'stale').length;
  const waiting = state.loops.filter(l => loopStatus(l) === 'waiting').length;
  document.getElementById('loopsMeta').textContent = ui.templates
    ? `${state.templates.loops.length}`
    : [stale && `! ${stale}`, waiting && `◷ ${waiting}`].filter(Boolean).join('  ');
}

// the note of a loop or task as a dim line: the first line and "+N" more, or all of it
function noteLine(item, cls, full) {
  if (!item.note) return '';
  const [first, ...rest] = item.note.split('\n');
  const text = full ? esc(item.note) : esc(first) + (rest.length ? ` <span class="note-age">+${rest.length}</span>` : '');
  return `<div class="${cls}${full ? ' full' : ''}">✎ ${text} <span class="note-age">· ${age(item.noteAt)}</span></div>`;
}

// a real loop without a next action is "waiting" if something is waiting, else "stale"
function loopStatus(l) {
  if (l.id === null || nextOf(l.id)) return 'ok';
  return openTasks(l.id).some(isWaiting) ? 'waiting' : 'stale';
}

function taskRow(t, i, { selected, showTag, other, marks, notes }) {
  const ed = ui.editing;
  const time = timeOf(t);
  const next = marks && isNext(t);
  const cls = ['row',
    selected && 'sel',
    next && 'next',
    marks && !next && !t.done && 'backlog',
    t.done && 'done',
    other && 'other',
    // template times aren't appointments, so they're never due
    !t.done && time !== null && time <= nowMinutes() && !state.templates.tasks.includes(t) && 'due',
    t.id === ui.cutId && 'cut',
    notes && t.note && 'has-note'].filter(Boolean).join(' ');
  // search hits are highlighted in the middle pane only (marks is set there)
  const hl = s => marks ? highlight(s, 'tasks') : esc(s);
  const l = loopById(t.loopId);
  const tag = showTag ? `<span class="tag${l ? '' : ' none'}">[${l ? hl(l.title) : '–'}]</span>` : '';
  const name = ed && ed.kind === 'rename' && ed.id === t.id
    ? editInput(t.title)
    : `<span class="name">${hl(displayTitle(t))}</span>`;
  const check = t.done ? '✓' : isWaiting(t) ? '◷' : next ? '▸' : '·';
  const timeEl = time !== null ? `<span class="time">${hl(fmtTime(time))}</span>` : '';
  const star = !t.done && isImportant(t) ? `<span class="star">★</span>` : '';
  // how long it's been waiting
  const waited = !t.done && t.waitingSince ? `<span class="wait-age">${age(t.waitingSince)}</span>` : '';
  // the middle pane shows the note below the task; the side panels just mark it
  // (in full while the task is selected)
  const note = notes ? noteLine(t, 'task-note', selected) : t.note ? '<span class="note-mark">✎</span>' : '';
  return `<li class="${cls}" data-i="${i}"><span class="check">${check}</span>${star}${timeEl}${tag}${name}${waited}${note}</li>`;
}

function newTaskRow() {
  return `<li class="row sel"><span class="check">·</span>${editInput('')}</li>`;
}

function renderTasks() {
  const loop = currentLoop();
  const adding = ui.editing && ui.editing.kind === 'new-task';
  const ts = currentTasks();
  const rows = ts.map((t, i) => taskRow(t, i, {
    selected: ui.focus === 'tasks' && i === ui.taskIdx && !adding,
    // the [loop] tag only adds information in the virtual views
    showTag: loop.id === null,
    // highlight next actions (not in templates, and not in the side panels)
    marks: !ui.templates,
    notes: true,
  }));
  if (adding) rows.splice(ui.editing.at, 0, newTaskRow());
  if (!rows.length) {
    rows.push(
      loop.kind === 'none' ? `<li class="empty">Create a template in the left pane first.</li>`
      : ui.templates ? `<li class="empty">Empty template. Press o to add a task.</li>`
      : loop.id === null ? `<li class="empty">No tasks. Press o to add one.</li>`
      : `<li class="empty stale">No next action. Press o to add one.</li>`);
  }
  // the loop's note in full above its tasks (the left pane cuts it off)
  if (loop.note) rows.unshift(`<li class="note-block"><div class="clamp">✎ ${esc(loop.note)} <span class="note-age">· ${age(loop.noteAt)}</span></div>`
    + (loop.note.split('\n').length > 6 ? '<span class="note-age">m to see all</span>' : '') + '</li>');
  document.getElementById('tasks').innerHTML = rows.join('');

  const open = ts.filter(t => !t.done).length;
  document.getElementById('tasksTitle').textContent = loop.title;
  document.getElementById('tasksMeta').textContent = ui.templates ? `${open} tasks` : `${open} open`;
}

// read-only lists in the right column
function renderSide(id, ts, emptyMsg) {
  const loop = currentLoop();
  const rows = ts.map((t, i) => taskRow(t, i, {
    showTag: true,
    other: !ui.templates && loop.id !== null && t.loopId !== loop.id,
  }));
  if (!rows.length) rows.push(`<li class="empty">${emptyMsg}</li>`);
  document.getElementById(id).innerHTML = rows.join('');
  document.getElementById(id + 'Meta').textContent = sideMeta(ts, loop);
}

const narrow = window.matchMedia('(max-width: 1100px)');

// one-line stand-in for the right column on narrow windows; s shows the full column
function renderSummary() {
  const now = nowMinutes();
  const imp = importantTasks().length;
  const wait = waitingTasks().length;
  const timed = timedTasks();
  const due = timed.filter(t => timeOf(t) <= now).length;
  const upcoming = timed.find(t => timeOf(t) > now);
  const parts = [
    imp && `<span><span class="star">★</span> ${imp} important</span>`,
    wait && `<span class="wait">◷ ${wait} waiting</span>`,
    due && `<span class="due">${due} due</span>`,
    upcoming && `<span>next <span class="time">${fmtTime(timeOf(upcoming))}</span> ${esc(displayTitle(upcoming))}</span>`,
  ].filter(Boolean);
  document.getElementById('summary').innerHTML = (parts.length ? parts.join('') : '<span>nothing important, waiting or timed</span>')
    + `<span class="hint">s ${ui.sideOpen ? 'hide' : 'details'}</span>`;
  document.body.classList.toggle('side-open', ui.sideOpen);
}

function toggleSide() {
  ui.sideOpen = narrow.matches && !ui.sideOpen;
}

document.getElementById('summary').addEventListener('click', () => { toggleSide(); render(); });
// widening the window brings the column back in place, so drop the overlay state
narrow.addEventListener('change', () => { ui.sideOpen = false; render(); });

function sideMeta(ts, loop) {
  if (!ts.length) return '';
  if (loop.id === null || ui.templates) return `${ts.length}`;
  return `${ts.filter(t => t.loopId === loop.id).length} here · ${ts.length} total`;
}

function renderChrome() {
  PANES.forEach(p => document.getElementById(p + 'Pane').classList.toggle('focused', ui.focus === p));
  document.body.classList.toggle('template-mode', ui.templates);

  const loop = currentLoop();
  const task = selTask();
  document.getElementById('crumb').innerHTML =
    `${ui.templates ? 'templates' : 'loops'} / <b>${esc(loop.title)}</b>` + (task ? ` / ${esc(displayTitle(task))}` : '');

  const cut = db().tasks.find(t => t.id === ui.cutId);
  const typing = ui.search && ui.search.typing;
  const hints = ui.editing && ui.editing.kind === 'note'
    ? (vim.cmd !== null ? '<kbd>enter</kbd> run  <kbd>esc</kbd> cancel  <kbd>:w</kbd> save  <kbd>:wq</kbd>/<kbd>:x</kbd> save and close  <kbd>:q</kbd> close  <kbd>:q!</kbd> discard'
      : vim.mode === 'normal'
      ? '<kbd>hjkl</kbd> <kbd>w/b/e</kbd> <kbd>0/$</kbd> <kbd>gg/G</kbd> move  <kbd>i/a/I/A/o/O</kbd> insert  <kbd>x</kbd> <kbd>dd</kbd> <kbd>D</kbd> <kbd>d/c</kbd>+<kbd>w/e/b/$/0/iw</kbd> <kbd>cc</kbd> <kbd>C</kbd> delete/change  <kbd>:wq</kbd>/<kbd>ZZ</kbd> save  <kbd>:w</kbd> save, stay  <kbd>:q!</kbd> discard  empty removes the note'
      : '<kbd>esc</kbd> normal mode  <kbd>⌘/ctrl+enter</kbd> save  <kbd>enter</kbd> new line')
    : ui.editing
    ? '<kbd>enter</kbd> save  <kbd>esc</kbd> cancel  <kbd>@w</kbd> waiting  <kbd>@i</kbd> important  <kbd>14:30</kbd> / <kbd>+20m</kbd> timed'
    : typing
      ? '<kbd>enter</kbd> confirm  <kbd>esc</kbd> cancel'
    : ui.picker
      ? '<kbd>j/k</kbd> select  <kbd>enter</kbd> create loop  <kbd>esc</kbd> cancel'
    : ui.templates
      ? `<kbd>T</kbd> back to loops  <kbd>j/k</kbd> select  <kbd>J/K</kbd> reorder  <kbd>h/l</kbd> panes  <kbd>o/O</kbd> new ${ui.focus === 'loops' ? 'template' : 'task'} below/above  <kbd>r</kbd> rename  <kbd>m</kbd> note  <kbd>d</kbd> delete  <kbd>w/i</kbd> waiting/important  <kbd>/</kbd> search  <kbd>u</kbd> undo`
    : ui.focus === 'loops'
      ? '<kbd>j/k</kbd> select  <kbd>J/K</kbd> reorder  <kbd>l</kbd> open  <kbd>t</kbd> new from template  <kbd>T</kbd> templates  <kbd>o/O</kbd> new loop below/above  <kbd>r</kbd> rename  <kbd>m</kbd> note  <kbd>d</kbd> delete  <kbd>p</kbd> paste  <kbd>/</kbd> search  <kbd>n/N</kbd> next/prev  <kbd>u</kbd> undo'
      : `<kbd>j/k</kbd> select  <kbd>J/K</kbd> reorder  <kbd>h</kbd> back  <kbd>o/O</kbd> new below/above  <kbd>space</kbd> done  <kbd>w</kbd> waiting  <kbd>i</kbd> important  <kbd>r</kbd> rename  <kbd>m</kbd> note  <kbd>x</kbd> cut  <kbd>p</kbd> paste  <kbd>d</kbd> delete  <kbd>.</kbd> show done  <kbd>/</kbd> search  <kbd>n/N</kbd> next/prev  <kbd>u</kbd> undo`;

  document.getElementById('mode').textContent = ui.editing && ui.editing.kind === 'note' ? `NOTE ${vim.cmd !== null ? 'COMMAND' : vim.mode.toUpperCase()}`
    : ui.editing ? 'INSERT' : typing ? 'SEARCH'
    : ui.picker ? 'TEMPLATE' : ui.focus.toUpperCase();
  document.getElementById('tplBadge').hidden = !ui.templates;
  document.getElementById('searchBox').hidden = !typing;
  document.getElementById('searchInfo').innerHTML = searchInfo();
  document.getElementById('clip').textContent = cut ? `cut: ${displayTitle(cut)}` : '';
  const flash = document.getElementById('flash');
  flash.textContent = ui.flash ? ui.flash.text : '';
  flash.classList.toggle('error', !!(ui.flash && ui.flash.error));
  document.getElementById('hints').innerHTML = hints;
}

// ── Search ────────────────────────────────────────────────────────────────────
// "/" finds things in the focused pane and jumps to them (yazi style); nothing is hidden.
// ui.search = { pane, loopIdx, query, typing, origin: { loopIdx, taskIdx } }

// smart case: lowercase queries ignore case, any capital makes it exact
function findAll(text, q) {
  const exact = q !== q.toLowerCase();
  const hay = exact ? text : text.toLowerCase();
  const needle = exact ? q : q.toLowerCase();
  const found = [];
  for (let j = hay.indexOf(needle); j !== -1; j = hay.indexOf(needle, j + needle.length)) found.push(j);
  return found;
}

const searching = pane => ui.search && ui.search.query && ui.search.pane === pane;

function highlight(text, pane) {
  if (!searching(pane)) return esc(text);
  const q = ui.search.query;
  let out = '', i = 0;
  for (const j of findAll(text, q)) {
    out += esc(text.slice(i, j)) + `<mark>${esc(text.slice(j, j + q.length))}</mark>`;
    i = j + q.length;
  }
  return out + esc(text.slice(i));
}

// the text of each row as shown on screen, in list order
function searchTexts(pane) {
  if (pane === 'loops') return loopsList().map(l => l.title);
  const inAll = currentLoop().id === null;
  return currentTasks().map(t => {
    const time = timeOf(t), l = loopById(t.loopId);
    return [time !== null && fmtTime(time), inAll && l && l.title, displayTitle(t)].filter(Boolean).join(' ');
  });
}

function matchIndexes() {
  const s = ui.search;
  if (!s || !s.query) return [];
  return searchTexts(s.pane).flatMap((txt, i) => findAll(txt, s.query).length ? [i] : []);
}

const searchCursor = () => ui.search.pane === 'loops' ? ui.loopIdx : ui.taskIdx;
function setSearchCursor(i) {
  if (ui.search.pane === 'tasks') return void (ui.taskIdx = i);
  if (i !== ui.loopIdx) ui.taskIdx = 0;
  ui.loopIdx = i;
}

// move to the nearest match in `dir`, wrapping around; `inclusive` lets the start row count
function jumpToMatch(from, dir, inclusive) {
  const hits = matchIndexes();
  const n = searchTexts(ui.search.pane).length;
  for (let k = inclusive ? 0 : 1; k <= n && hits.length; k++) {
    const i = ((from + dir * k) % n + n) % n;
    if (!hits.includes(i)) continue;
    ui.flash = (dir > 0 ? from + k >= n : from - k < 0) ? { text: 'search wrapped' } : null;
    setSearchCursor(i);
    return;
  }
}

function startSearch() {
  ui.search = {
    pane: ui.focus, loopIdx: ui.loopIdx, query: '', typing: true,
    origin: { loopIdx: ui.loopIdx, taskIdx: ui.taskIdx },
  };
  searchInput.value = '';
}

function endSearchTyping(confirm) {
  const s = ui.search;
  if (!confirm) {
    ui.loopIdx = s.origin.loopIdx;
    ui.taskIdx = s.origin.taskIdx;
  }
  if (confirm && s.query) s.typing = false;
  else ui.search = null;
  searchInput.blur();
  render();
}

function searchNext(dir) {
  const s = ui.search;
  if (s && s.query && s.pane === ui.focus) jumpToMatch(searchCursor(), dir, false);
}

function searchInfo() {
  const s = ui.search;
  if (!s || !s.query) return '';
  const prefix = s.typing ? '' : `/${esc(s.query)}  `;
  const hits = matchIndexes();
  if (!hits.length) return `${prefix}<span class="no-match">no match</span>`;
  const pos = hits.indexOf(searchCursor()) + 1;
  return `${prefix}${pos || '-'}/${hits.length}`;
}

// a confirmed search ends once you leave its pane, or its loop for a task search
function dropStaleSearch() {
  const s = ui.search;
  if (!s || s.typing) return;
  if (s.pane !== ui.focus || (s.pane === 'tasks' && s.loopIdx !== ui.loopIdx)) ui.search = null;
}

const searchInput = document.getElementById('searchInput');

// typing re-searches from where the cursor was when "/" was pressed
searchInput.addEventListener('input', () => {
  const s = ui.search;
  s.query = searchInput.value;
  ui.loopIdx = s.origin.loopIdx;
  ui.taskIdx = s.origin.taskIdx;
  if (s.query) jumpToMatch(searchCursor(), 1, true);
  render();
});

searchInput.addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Enter') { e.preventDefault(); endSearchTyping(true); }
  else if (e.key === 'Escape') { e.preventDefault(); endSearchTyping(false); }
});

searchInput.addEventListener('blur', () => {
  if (ui.search && ui.search.typing) endSearchTyping(true);
});

// ── Editing ───────────────────────────────────────────────────────────────────

function commitEdit(value) {
  const ed = ui.editing;
  if (ed.kind === 'note') {
    saveNote(value);
    ui.editing = null;
    return render();
  }
  ui.editing = null;
  value = value.trim();
  if (!value) return render();
  // relative times only mean something for real tasks; a template has no "now"
  const isTask = ed.kind === 'new-task' || (ed.kind === 'rename' && !loopById(ed.id));
  if (isTask && !ui.templates) value = resolveRelative(value);

  if (ed.kind === 'new-loop') {
    mutate(() => db().loops.splice(ed.at, 0, { id: uid(), title: value, createdAt: Date.now() }));
    ui.loopIdx = virtuals().length + ed.at;
  } else if (ed.kind === 'new-task') {
    const task = { id: uid(), title: value, loopId: currentLoop().id, done: false, createdAt: Date.now() };
    mutate(() => {
      // insert next to the task the cursor was on, or at the end if there was none
      const tasks = db().tasks;
      const anchor = tasks.findIndex(t => t.id === ed.anchorId);
      if (anchor < 0) tasks.push(task);
      else tasks.splice(anchor + (ed.below ? 1 : 0), 0, task);
    });
    ui.focus = 'tasks';
    ui.taskIdx = currentTasks().indexOf(task);
  } else if (ed.kind === 'rename') {
    const item = loopById(ed.id) || db().tasks.find(t => t.id === ed.id);
    if (item) mutate(() => { item.title = value; });
  }
  render();
}

function cancelEdit() {
  ui.editing = null;
  render();
}

document.addEventListener('keydown', e => {
  if (!e.target.classList.contains('edit')) return;
  e.stopPropagation();
  if (e.key === 'Enter') commitEdit(e.target.value);
  else if (e.key === 'Escape') cancelEdit();
}, true);

document.addEventListener('focusout', e => {
  if (e.target.classList.contains('edit') && ui.editing) cancelEdit();
});

// ── Keys ──────────────────────────────────────────────────────────────────────

function move(delta) {
  if (ui.focus === 'loops') {
    ui.loopIdx += delta;
    ui.taskIdx = 0;
  } else {
    ui.taskIdx += delta;
  }
}

function jump(toEnd) {
  if (ui.focus === 'loops') {
    ui.loopIdx = toEnd ? loopsList().length - 1 : 0;
    ui.taskIdx = 0;
  } else {
    ui.taskIdx = toEnd ? currentTasks().length - 1 : 0;
  }
}

function focusPane(delta) {
  const i = PANES.indexOf(ui.focus) + delta;
  if (i >= 0 && i < PANES.length) ui.focus = PANES[i];
}

function swap(arr, i, j) { [arr[i], arr[j]] = [arr[j], arr[i]]; }

// J/K: move the selected item down/up; the virtual views stay pinned on top
function shift(delta) {
  if (ui.focus === 'loops') {
    const i = ui.loopIdx - virtuals().length, j = i + delta;
    if (i < 0 || j < 0 || j >= db().loops.length) return;
    mutate(() => swap(db().loops, i, j));
    ui.loopIdx += delta;
  } else {
    // swap with the visible neighbour, so it works inside a filtered view
    const ts = currentTasks();
    const a = ts[ui.taskIdx], b = ts[ui.taskIdx + delta];
    if (!a || !b || a.done !== b.done) return;
    mutate(() => { const ts = db().tasks; swap(ts, ts.indexOf(a), ts.indexOf(b)); });
    ui.taskIdx += delta;
  }
}

// o / O: new item below / above the selected one; `at` is where the input row shows
function add(below) {
  if (ui.focus === 'loops') {
    // on "All", new loops go to the top of the real loops
    const i = ui.loopIdx - virtuals().length;
    ui.editing = { kind: 'new-loop', at: i < 0 ? 0 : i + (below ? 1 : 0) };
  } else {
    if (currentLoop().kind === 'none') return;   // no template to add tasks to
    const anchor = selTask();
    ui.editing = {
      kind: 'new-task',
      anchorId: anchor && anchor.id,
      below,
      at: anchor ? ui.taskIdx + (below ? 1 : 0) : currentTasks().length,
    };
  }
}

function rename() {
  const item = ui.focus === 'loops' ? currentLoop() : selTask();
  if (item && item.id) ui.editing = { kind: 'rename', id: item.id };
}

function remove() {
  if (ui.focus === 'loops') {
    const loop = currentLoop();
    if (!loop.id) return;
    // deleting a loop keeps its tasks, unassigned
    mutate(() => {
      const d = db();
      if (ui.templates) d.tasks = d.tasks.filter(t => t.loopId !== loop.id);   // a template's tasks go with it
      else d.tasks.forEach(t => { if (t.loopId === loop.id) t.loopId = null; });
      d.loops = d.loops.filter(l => l.id !== loop.id);
    });
  } else {
    const task = selTask();
    if (task) mutate(() => { db().tasks = db().tasks.filter(t => t.id !== task.id); });
  }
}

function toggleDone() {
  if (ui.templates) return;   // templates are never done; their copies are
  const task = selTask();
  if (task) mutate(() => { task.done = !task.done; task.doneAt = task.done ? Date.now() : null; });
}

function toggleMarker(tok) {
  const task = selTask();
  if (!task || task.done) return;
  mutate(() => { task.title = toggleToken(task.title, tok); });
  // handing something off is a good moment to write down where you are
  if (tok === '@w' && isWaiting(task)) ui.flash = { text: 'm to note where you left off' };
}

// m: note on the selected loop or task
function editNote() {
  const item = ui.focus === 'loops' ? currentLoop() : selTask();
  if (!item || !item.id) return;
  ui.editing = { kind: 'note', id: item.id };
  noteInput.value = item.note || '';
  Object.assign(vim, { mode: 'normal', pending: '', count: '', opCount: 1, goal: null, cmd: null, msg: '' });
  setCursor(0);
  document.getElementById('noteHead').textContent = `Note · ${loopById(item.id) ? item.title : displayTitle(item)}`;
}

const noteInput = document.getElementById('noteInput');
const cleanNote = value => value.replace(/[ \t]+$/gm, '').trim();
const noteItem = () => loopById(ui.editing.id) || db().tasks.find(t => t.id === ui.editing.id);
const noteChanged = () => cleanNote(noteInput.value) !== (noteItem().note || '');

// an empty note removes it
function saveNote(value) {
  const item = noteItem();
  value = cleanNote(value);
  if (item && value !== (item.note || '')) mutate(() => {
    if (value) Object.assign(item, { note: value, noteAt: Date.now() });
    else { delete item.note; delete item.noteAt; }
  });
}

// ── Note editor: a few vim keys ──────────────────────────────────────────────
// opens in normal mode at the top; esc goes back to normal mode, :wq (or ZZ) saves.
// cmd/ctrl+enter saves from either mode. no undo inside the note.

// pending: keys typed so far of a multi-key command (g, Z, d, c, di, ci)
// opCount: the count typed before d/c, multiplied with the one after (2d3w)
// cmd: the ":" command being typed (null when none); msg: its result, shown until the next key
const vim = { mode: 'insert', pending: '', count: '', opCount: 1, goal: null, cmd: null, msg: '' };

const lineStart = (v, p) => v.lastIndexOf('\n', p - 1) + 1;
const lineEnd = (v, p) => { const i = v.indexOf('\n', p); return i < 0 ? v.length : i; };
// in normal mode the cursor sits on a character, so the last one is the end of the line
const lastCol = (v, p) => Math.max(lineStart(v, p), lineEnd(v, p) - 1);
const charClass = c => c === undefined || /\s/.test(c) ? 0 : /\w/.test(c) ? 1 : 2;

function vertical(v, p, dir) {
  const start = lineStart(v, p);
  if (vim.goal === null) vim.goal = p - start;
  const target = dir > 0 ? lineEnd(v, p) + 1 : start - 1;
  if (target < 0 || target > v.length) return p;
  const ts = lineStart(v, target);
  return Math.min(ts + vim.goal, lastCol(v, ts));
}

// may land past the last character, which d/c need to reach the end
function wordForwardRaw(v, p) {
  const c = charClass(v[p]);
  while (p < v.length && c && charClass(v[p]) === c) p++;
  while (p < v.length && !charClass(v[p])) p++;
  return p;
}
const wordForward = (v, p) => Math.min(wordForwardRaw(v, p), Math.max(0, v.length - 1));
function wordBack(v, p) {
  p--;
  while (p > 0 && !charClass(v[p])) p--;
  const c = charClass(v[p]);
  while (p > 0 && charClass(v[p - 1]) === c) p--;
  return Math.max(0, p);
}
function wordEnd(v, p) {
  p++;
  while (p < v.length && !charClass(v[p])) p++;
  const c = charClass(v[p]);
  while (p < v.length - 1 && charClass(v[p + 1]) === c) p++;
  return Math.min(p, Math.max(0, v.length - 1));
}

const MOTIONS = {
  h: (v, p) => Math.max(lineStart(v, p), p - 1),
  l: (v, p) => Math.min(lastCol(v, p), p + 1),
  j: (v, p) => vertical(v, p, 1),
  k: (v, p) => vertical(v, p, -1),
  w: wordForward,
  b: wordBack,
  e: wordEnd,
  0: (v, p) => lineStart(v, p),
  $: (v, p) => lastCol(v, p),
  '^': (v, p) => { const s = lineStart(v, p); const m = v.slice(s, lineEnd(v, p)).search(/\S/); return m < 0 ? s : s + m; },
  G: (v) => lineStart(v, v.length),
  gg: () => 0,
};
const ARROWS = { ArrowLeft: 'h', ArrowRight: 'l', ArrowDown: 'j', ArrowUp: 'k', Enter: 'j' };

// show the cursor as a one-character selection in normal mode
function setCursor(p, mode = vim.mode) {
  const v = noteInput.value;
  if (mode === 'normal') {
    p = Math.max(0, Math.min(p, lastCol(v, p)));
    const onChar = !!v[p] && v[p] !== '\n';
    noteInput.classList.toggle('no-char', !onChar);
    noteInput.setSelectionRange(p, onChar ? p + 1 : p);
  } else {
    noteInput.setSelectionRange(p, p);
  }
}

function setMode(mode, p) {
  vim.mode = mode;
  vim.pending = vim.count = '';
  vim.opCount = 1;
  vim.cmd = null;
  document.getElementById('noteBox').classList.toggle('normal', mode === 'normal');
  render();   // mode label and hints
  setCursor(p, mode);
}

// replace v[from, to) with text and put the cursor at `at`
function splice(from, to, text, at, mode = vim.mode) {
  const v = noteInput.value;
  noteInput.value = v.slice(0, from) + text + v.slice(to);
  if (mode !== vim.mode) setMode(mode, at); else setCursor(at);
}

function normalKey(key) {
  const v = noteInput.value;
  const p = noteInput.selectionStart;
  if (/^[1-9]$/.test(key) || (key === '0' && vim.count)) { vim.count += key; return; }
  const n = Math.max(1, +vim.count || 1);
  const cmd = vim.pending + key;
  vim.pending = '';
  vim.count = '';
  if (!'jk'.includes(cmd)) vim.goal = null;

  // d/c followed by a motion or iw
  const op = cmd[0];
  if (cmd.length > 1 && 'dc'.includes(op) && cmd !== 'dd' && cmd !== 'cc') {
    if (cmd.length === 2 && key === 'i') { vim.pending = cmd; vim.count = ''; return; }
    const range = opRange(v, p, op, cmd.slice(1), n * vim.opCount);
    vim.opCount = 1;
    if (!range) return;
    const [from, to] = range;
    return splice(from, to, '', from, op === 'c' ? 'insert' : 'normal');
  }

  if (MOTIONS[cmd]) {
    let q = p;
    for (let i = 0; i < n; i++) q = MOTIONS[cmd](noteInput.value, q);
    return setCursor(q);
  }
  const ls = lineStart(v, p), le = lineEnd(v, p);
  switch (cmd) {
    case 'g': case 'Z': vim.pending = cmd; return;
    case ':': vim.cmd = ''; return renderNoteMode();
    case 'd': case 'c': vim.pending = cmd; vim.opCount = n; return;
    case 'i': return setMode('insert', p);
    case 'a': return setMode('insert', Math.min(p + 1, le));
    case 'I': return setMode('insert', MOTIONS['^'](v, p));
    case 'A': return setMode('insert', le);
    case 'o': return splice(le, le, '\n', le + 1, 'insert');
    case 'O': return splice(ls, ls, '\n', ls, 'insert');
    case 'x': return splice(p, Math.min(p + n, le), '', p);
    case 'D': return splice(p, le, '', Math.max(ls, p - 1));
    case 'dd': {
      // n lines from here, including their line break
      let end = le;
      for (let i = 1; i < n && end < v.length; i++) end = lineEnd(v, end + 1);
      const from = end < v.length ? ls : Math.max(0, ls - 1);
      return splice(from, Math.min(v.length, end + 1), '', from === ls ? ls : lineStart(v, from - 1));
    }
    case 'C': return splice(p, le, '', p, 'insert');
    case 'cc': return splice(ls, le, '', ls, 'insert');
    case 'ZZ': return commitEdit(noteInput.value);
  }
}

// :w saves and stays, :wq / :x save and close, :q closes if nothing changed, :q! discards
function runCommand(c) {
  vim.cmd = null;
  if (c === 'w') { saveNote(noteInput.value); vim.msg = 'written'; return render(); }
  if (c === 'wq' || c === 'x') return commitEdit(noteInput.value);
  if (c === 'q!' || (c === 'q' && !noteChanged())) return cancelEdit();
  vim.msg = c === 'q' ? 'E37: no write since last change (add ! to override)' : `E492: not an editor command: ${c}`;
  renderNoteMode();
}

function commandKey(e) {
  e.preventDefault();
  if (e.key === 'Enter') return runCommand(vim.cmd.trim());
  if (e.key === 'Escape' || (e.key === 'Backspace' && !vim.cmd)) vim.cmd = null;
  else if (e.key === 'Backspace') vim.cmd = vim.cmd.slice(0, -1);
  else if (e.key.length === 1) vim.cmd += e.key;
  render();
}

// the text a d/c command acts on, as [from, to)
function opRange(v, p, op, target, n) {
  const ls = lineStart(v, p), le = lineEnd(v, p);
  const repeat = (fn, q = p) => { for (let i = 0; i < n; i++) q = fn(v, q); return q; };
  switch (target) {
    case 'w': {
      // cw on a word changes just the word (like ce), keeping the space after it
      if (op === 'c' && charClass(v[p])) {
        let q = p;
        while (q + 1 < le && charClass(v[q + 1]) === charClass(v[p])) q++;
        for (let i = 1; i < n; i++) q = wordEnd(v, q);
        return [p, q + 1];
      }
      // dw stops at the end of the line
      return [p, Math.min(repeat(wordForwardRaw), le)];
    }
    case 'e': return [p, Math.min(repeat(wordEnd) + 1, v.length)];
    case 'b': return [repeat(wordBack), p];
    case 'h': return [Math.max(ls, p - n), p];
    case 'l': return [p, Math.min(le, p + n)];
    case '0': return [ls, p];
    case '^': { const q = MOTIONS['^'](v, p); return [Math.min(p, q), Math.max(p, q)]; }
    case '$': return [p, le];
    case 'iw': {
      // the run of word, punctuation or space characters under the cursor
      if (p >= le) return null;
      const c = charClass(v[p]);
      let from = p, to = p + 1;
      while (from > ls && charClass(v[from - 1]) === c) from--;
      while (to < le && charClass(v[to]) === c) to++;
      return [from, to];
    }
  }
  return null;
}

noteInput.addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
    e.preventDefault();
    return commitEdit(noteInput.value);
  }
  if (vim.mode === 'insert') {
    if (e.key !== 'Escape') return;   // typing works as usual
    e.preventDefault();
    const p = noteInput.selectionStart;
    return setMode('normal', Math.max(lineStart(noteInput.value, p), p - 1));
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;   // copy, select all, ...
  if (vim.cmd !== null) return commandKey(e);
  if (vim.msg) { vim.msg = ''; renderNoteMode(); }
  if (e.key.length === 1 || ARROWS[e.key] || e.key === 'Escape') e.preventDefault();
  if (e.key === 'Escape') { vim.pending = vim.count = ''; vim.opCount = 1; return; }
  normalKey(ARROWS[e.key] || e.key);
});

// a click in normal mode puts the block cursor there
noteInput.addEventListener('mouseup', () => {
  if (vim.mode === 'normal' && noteInput.selectionStart === noteInput.selectionEnd) setCursor(noteInput.selectionStart);
});

// clicking elsewhere saves too, so a long note is never lost
noteInput.addEventListener('blur', () => {
  if (ui.editing && ui.editing.kind === 'note') commitEdit(noteInput.value);
});

function renderNoteMode() {
  const el = document.getElementById('noteMode');
  el.textContent = vim.cmd !== null ? `:${vim.cmd}▏` : vim.msg
    || (vim.mode === 'normal' ? 'NORMAL' : 'INSERT');
  el.classList.toggle('error', vim.msg.startsWith('E'));
}

function renderNoteBox() {
  const open = !!(ui.editing && ui.editing.kind === 'note');
  const box = document.getElementById('noteBox');
  box.hidden = !open;
  box.classList.toggle('normal', open && vim.mode === 'normal');
  renderNoteMode();
  if (open && document.activeElement !== noteInput) noteInput.focus();
}

function cut() {
  const task = selTask();
  if (task) ui.cutId = ui.cutId === task.id ? null : task.id;
}

// pasting into "All" unassigns the task
function paste() {
  const task = db().tasks.find(t => t.id === ui.cutId);
  if (!task) return;
  mutate(() => { task.loopId = currentLoop().id; });
  ui.cutId = null;
}

function undo() {
  if (!history.length) return;
  state = JSON.parse(history.pop());
  persist();
}

// ── Templates ─────────────────────────────────────────────────────────────────
// T switches the panes between your loops and the templates; each side keeps its cursor.
// t (outside template mode) picks a template and copies it into a new loop.

function toggleTemplates() {
  const here = { focus: ui.focus, loopIdx: ui.loopIdx, taskIdx: ui.taskIdx };
  Object.assign(ui, ui.otherCursor || { focus: 'loops', loopIdx: 0, taskIdx: 0 });
  ui.otherCursor = here;
  ui.templates = !ui.templates;
  ui.search = null;
  ui.cutId = null;   // a cut task can't be pasted across modes
}

function openPicker() {
  if (ui.templates) return;
  if (!state.templates.loops.length) {
    ui.flash = { text: 'no templates yet — press T to create one' };
    return;
  }
  ui.picker = { idx: 0 };
}

function pickerKey(key) {
  const n = state.templates.loops.length;
  if (key === 'j' || key === 'ArrowDown') ui.picker.idx = Math.min(n - 1, ui.picker.idx + 1);
  else if (key === 'k' || key === 'ArrowUp') ui.picker.idx = Math.max(0, ui.picker.idx - 1);
  else if (key === 'Enter') { createFromTemplate(state.templates.loops[ui.picker.idx]); ui.picker = null; }
  else if (key === 'Escape') ui.picker = null;
}

// a new copy every time, placed below the selected loop (at the top when on "All")
function createFromTemplate(tpl) {
  const i = ui.loopIdx - VIRTUAL.length;
  const at = i < 0 ? 0 : i + 1;
  const loop = { id: uid(), title: tpl.title, createdAt: Date.now() };
  mutate(() => {
    state.loops.splice(at, 0, loop);
    state.templates.tasks
      .filter(t => t.loopId === tpl.id && !t.done)
      .forEach(t => state.tasks.push({ id: uid(), title: t.title, loopId: loop.id, done: false, createdAt: Date.now() }));
  });
  Object.assign(ui, { loopIdx: VIRTUAL.length + at, taskIdx: 0, focus: 'tasks' });
  ui.flash = { text: `created "${tpl.title}" from template` };
}

function renderPicker() {
  const box = document.getElementById('picker');
  box.hidden = !ui.picker;
  if (!ui.picker) return;
  document.getElementById('pickerList').innerHTML = state.templates.loops.map((l, i) => {
    const n = state.templates.tasks.filter(t => t.loopId === l.id).length;
    return `<li class="row${i === ui.picker.idx ? ' sel' : ''}"><span class="name">${esc(l.title)}</span><span class="count">${n}</span></li>`;
  }).join('');
}

const keymap = {
  j: () => move(1),          ArrowDown: () => move(1),
  k: () => move(-1),         ArrowUp: () => move(-1),
  J: () => shift(1),         K: () => shift(-1),
  g: () => jump(false),      G: () => jump(true),
  l: () => focusPane(1),     ArrowRight: () => focusPane(1),
  h: () => focusPane(-1),    ArrowLeft: () => focusPane(-1),
  Enter: () => { if (ui.focus === 'loops') ui.focus = 'tasks'; else toggleDone(); },
  o: () => add(true),
  O: () => add(false),
  r: rename,
  m: editNote,
  d: remove,
  ' ': toggleDone,
  w: () => toggleMarker('@w'),
  i: () => toggleMarker('@i'),
  x: cut,
  p: paste,
  u: undo,
  '.': () => { ui.showDone = !ui.showDone; },
  '/': startSearch,
  n: () => searchNext(1),
  N: () => searchNext(-1),
  t: openPicker,
  T: toggleTemplates,
  s: toggleSide,
  Escape: () => { ui.cutId = null; ui.search = null; ui.sideOpen = false; },
};

document.addEventListener('keydown', e => {
  if (ui.editing || (ui.search && ui.search.typing) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (ui.picker) {
    e.preventDefault();
    pickerKey(e.key);
    return render();
  }
  const fn = keymap[e.key];
  if (!fn) return;
  e.preventDefault();
  ui.flash = null;
  fn();
  render();
});

// ── Mouse ─────────────────────────────────────────────────────────────────────

document.getElementById('loops').addEventListener('click', e => {
  const row = e.target.closest('.row[data-i]');
  if (!row || ui.editing) return;
  if (+row.dataset.i !== ui.loopIdx) ui.taskIdx = 0;
  ui.loopIdx = +row.dataset.i;
  ui.focus = 'loops';
  render();
});

document.getElementById('tasks').addEventListener('click', e => {
  if (ui.editing) return;
  const row = e.target.closest('.row[data-i]');
  ui.focus = 'tasks';
  if (row) ui.taskIdx = +row.dataset.i;
  render();
});

// ── Export / import ───────────────────────────────────────────────────────────

function exportData() {
  const data = { app: 'loopy-tasks', version: 1, exportedAt: new Date().toISOString(), ...state };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `loopy-tasks-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  ui.flash = { text: `exported ${state.loops.length} loops, ${state.tasks.length} tasks, ${state.templates.loops.length} templates` };
}

// keep only well-formed entries; throws if the file isn't an export at all
function parseImport(text) {
  const data = JSON.parse(text);
  if (!data || !Array.isArray(data.loops) || !Array.isArray(data.tasks)) {
    throw new Error('expected { loops: [...], tasks: [...] }');
  }
  const t = data.templates;
  return {
    ...cleanLoops(data.loops, data.tasks),
    // templates are optional, for exports made before they existed
    templates: t && Array.isArray(t.loops) && Array.isArray(t.tasks)
      ? cleanLoops(t.loops, t.tasks)
      : { loops: [], tasks: [] },
  };
}

function cleanLoops(rawLoops, rawTasks) {
  const str = v => typeof v === 'string' && v.length > 0;
  const loops = rawLoops.filter(l => l && str(l.id) && str(l.title));
  const ids = new Set(loops.map(l => l.id));
  const tasks = rawTasks
    .filter(t => t && str(t.id) && str(t.title))
    .map(t => ({ ...t, done: !!t.done, loopId: ids.has(t.loopId) ? t.loopId : null }));
  return { loops, tasks };
}

// replaces everything; one `u` brings the previous data back
function importData(text) {
  try {
    const data = parseImport(text);
    mutate(() => { state = data; });
    Object.assign(ui, { focus: 'loops', loopIdx: 0, taskIdx: 0, cutId: null, search: null, templates: false, otherCursor: null });
    ui.flash = { text: `imported ${data.loops.length} loops, ${data.tasks.length} tasks, ${data.templates.loops.length} templates · u to undo` };
  } catch (err) {
    ui.flash = { text: `import failed: ${err.message}`, error: true };
  }
  render();
}

const importFile = document.getElementById('importFile');

// blur the buttons afterwards so space/enter keep driving the lists
document.getElementById('exportBtn').addEventListener('click', e => {
  e.currentTarget.blur();
  exportData();
  render();
});
document.getElementById('importBtn').addEventListener('click', e => {
  e.currentTarget.blur();
  importFile.click();
});
importFile.addEventListener('change', async () => {
  const file = importFile.files[0];
  importFile.value = '';   // allow re-importing the same file
  if (file) importData(await file.text());
});

// ── Reminders ─────────────────────────────────────────────────────────────────
// when a timed task's time comes, show a system notification (if allowed) plus a
// flash and a tab title marker. Only works while the page is open.

const NOTIFIED_KEY = 'loopy-notified';
const LATE_WINDOW = 15;   // still remind up to 15 min late, e.g. after the laptop wakes up
const PAGE_TITLE = document.title;
const canNotify = 'Notification' in window;

const todayKey = () => new Date().toLocaleDateString('sv');   // local YYYY-MM-DD

// { date, sent: ["taskId@minutes", ...] }, reset every day; keyed on the time
// as well, so changing a task's time reminds again
function loadNotified() {
  try {
    const n = JSON.parse(localStorage.getItem(NOTIFIED_KEY));
    if (n && n.date === todayKey()) return n;
  } catch {}
  return { date: todayKey(), sent: [] };
}

function checkReminders() {
  const now = nowMinutes();
  const today = new Date().setHours(0, 0, 0, 0);
  const notified = loadNotified();
  const due = timedTasks().filter(t => {
    const time = timeOf(t);
    return time <= now && now - time <= LATE_WINDOW
      && (t.createdAt || 0) < today + (time + 1) * 60_000   // not for tasks created after their minute
      && !notified.sent.includes(`${t.id}@${time}`);
  });
  if (!due.length) return;

  due.forEach(t => {
    notified.sent.push(`${t.id}@${timeOf(t)}`);
    remind(t);
  });
  localStorage.setItem(NOTIFIED_KEY, JSON.stringify(notified));
  const last = due[due.length - 1];
  document.title = `● ${fmtTime(timeOf(last))} ${displayTitle(last)}`;
  ui.flash = { text: `⏰ ${due.map(t => `${fmtTime(timeOf(t))} ${displayTitle(t)}`).join(', ')}` };
  if (!ui.editing) render();
}

function remind(t) {
  if (!canNotify || Notification.permission !== 'granted') return;
  const n = new Notification(`${fmtTime(timeOf(t))} ${displayTitle(t)}`, {
    body: state.loops.find(l => l.id === t.loopId)?.title || 'loopy-tasks',
    tag: t.id,
  });
  n.onclick = () => { window.focus(); n.close(); };
}

// the title marker stays until you come back to the page
const clearTitle = () => { document.title = PAGE_TITLE; };
window.addEventListener('focus', clearTitle);
document.addEventListener('keydown', clearTitle);

function renderNotifyBtn() {
  const btn = document.getElementById('notifyBtn');
  const perm = canNotify ? Notification.permission : 'unsupported';
  btn.textContent = { denied: 'reminders blocked', unsupported: 'reminders n/a' }[perm] || 'enable reminders';
  btn.hidden = perm === 'granted';
  btn.title = {
    denied: 'Notifications are blocked: allow them in the browser\'s site settings (and macOS System Settings → Notifications)',
    unsupported: 'This browser has no notifications; timed tasks still flash in the status bar',
  }[perm] || 'Get a system notification when a timed task is due';
}

document.getElementById('notifyBtn').addEventListener('click', async e => {
  e.currentTarget.blur();
  if (canNotify && Notification.permission === 'default') await Notification.requestPermission();
  if (canNotify && Notification.permission === 'granted') {
    new Notification('loopy-tasks', { body: 'Reminders are on for timed tasks.' });
  } else if (location.protocol === 'file:') {
    // Chrome never shows the permission prompt for files opened from disk
    ui.flash = { text: 'browsers don\'t allow notifications for file:// pages — serve it, e.g. python3 -m http.server, then open http://localhost:8000', error: true };
  }
  render();
});

// ── Seed ──────────────────────────────────────────────────────────────────────

function seed() {
  const loops = ['Website redesign', 'Quarterly report', 'Onboarding guide', 'Team offsite']
    .map(title => ({ id: uid(), title, createdAt: Date.now() }));
  state.loops = loops;
  const [web, report, guide] = loops;
  [
    ['Sketch new landing page @i', web.id],
    ['Collect feedback on current site', web.id],
    ['Agent: audit page load times @w', web.id],
    ['Draft sent to finance for review @w', report.id],
    ['Outline setup chapter', guide.id],
    ['Reply to invoice email', null],
    ['Standup 09:30', null],
    ['Design review 14:00', web.id],
    ['Book dentist appointment', null],
    ['Try a dark mode variant?', web.id],
    ['Add a glossary to the guide', guide.id],
  ].forEach(([title, loopId]) => state.tasks.push({ id: uid(), title, loopId, done: false, createdAt: Date.now() }));

  const daily = { id: uid(), title: 'Daily planning', createdAt: Date.now() };
  state.templates = {
    loops: [daily],
    tasks: ['Look at calendar', 'Look at messages', 'Pick 1–2 outcomes for today', 'Standup 09:30']
      .map(title => ({ id: uid(), title, loopId: daily.id, done: false, createdAt: Date.now() })),
  };
  stampWaiting();
  persist();
}

// ── Init ──────────────────────────────────────────────────────────────────────

load();
if (!state.loops.length && !state.tasks.length) seed();
render();

// keep "due" highlighting current; skip while typing so the input isn't reset
setInterval(() => { if (!ui.editing) render(); }, 60_000);
checkReminders();
setInterval(checkReminders, 15_000);
</script>
</body>
